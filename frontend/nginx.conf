# ──────────────────────────────────────────────────────────────────────────────
#  Nginx Configuration — Employee Management Portal
#
#  Architecture:
#    Browser → Nginx :80
#                ├── /api/*          → Spring Boot backend:8080  (reverse proxy)
#                └── /*              → React SPA (index.html fallback)
#
#  Backend context-path: server.servlet.context-path=/api
#  So all Spring Boot endpoints are already under /api/ — Nginx does NOT
#  need to rewrite the path.
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # ── Static asset root ─────────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_min_length 1024;

    # ── Backend reverse proxy ─────────────────────────────────────────────────
    #  Matches /api/* and /api (the context-path itself).
    #  Spring Boot receives the full /api/... path as configured.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        # Forward real client information to Spring Boot
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts appropriate for long-running API requests
        proxy_connect_timeout  30s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Do not pass internal server errors back verbatim
        proxy_intercept_errors off;
    }

    # ── React SPA — client-side routing fallback ──────────────────────────────
    #  Serves index.html for any path that does not match a real file,
    #  so React Router can handle navigation on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    #  Vite generates content-hashed filenames, so these can be cached
    #  aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Healthcheck endpoint for Docker / load balancers ─────────────────────
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
