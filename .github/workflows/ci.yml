name: CI/CD — Employee Management Portal

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND:  ${{ github.repository }}/emp-backend
  IMAGE_FRONTEND: ${{ github.repository }}/emp-frontend

jobs:

  # ── Backend: build & test ──────────────────────────────────
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        run: mvn clean verify -B

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }} .

  # ── Frontend: lint, build ──────────────────────────────────
  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }} .
