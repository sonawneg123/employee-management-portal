# ──────────────────────────────────────────────────────────────────────────────
#  GitHub Actions CI/CD — Employee Management Portal
#
#  Jobs:
#    backend-ci       Maven test + package (Java 21, Testcontainers)
#    frontend-ci      Vitest tests + ESLint + Vite production build (Node 20)
#    docker-build     Build backend and frontend Docker images (validation only)
#    compose-validate Verify docker-compose.yml is syntactically valid
#    publish          Build final images, push to ECR with immutable SHA tags
#                     (main branch only, after all CI jobs pass)
#    deploy           SSH to EC2, pull from ECR, docker compose up -d, health check
#                     (main branch + production environment only)
#
#  Triggers:
#    push  → main, develop
#    PR    → main, develop
#
#  Registry push / deployment:
#    - Only on push to main (never on PR, never on develop)
#    - Requires GitHub environment "production" (with deployment protection rules)
#    - Uses OIDC — no AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY stored anywhere
#
#  Image tags:
#    <full-sha> — full 40-char Git SHA (immutable, used for deployment + rollback)
#    main-<sha> — branch-prefixed variant for human browsing in ECR console
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD — Employee Management Portal

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ── Default permissions (CI-only jobs) ────────────────────────────────────────
# Overridden per-job where OIDC token or deployment permissions are needed.
permissions:
  contents: read

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Shared ECR image tag ───────────────────────────────────────────────────────
env:
  IMAGE_TAG: ${{ github.sha }}

# ── Job 1: Backend — Java 21 ──────────────────────────────────────────────────
jobs:
  backend-ci:
    name: Backend CI (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # actions/setup-java native Maven caching — caches ~/.m2/repository
          # keyed on pom.xml hash, invalidated only when dependencies change
          cache: maven

      - name: Build and test
        # mvn verify: compile → test → package → verify
        # Testcontainers integration tests run here and require Docker.
        # GitHub Actions runners have Docker pre-installed.
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ── Job 2: Frontend — Node 20 ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node 20 / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # actions/setup-node native npm caching — keyed on package-lock.json hash
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Vitest)
        # vitest run exits non-zero on any test failure — CI fails correctly
        run: npm test

      - name: Lint (ESLint — 0 warnings policy)
        run: npm run lint

      - name: Production build (Vite)
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Job 3: Docker image builds (validation) ───────────────────────────────
  docker-build:
    name: Docker Build (backend + frontend)
    runs-on: ubuntu-latest
    # Only validate Docker images after both application CI jobs pass
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          # Cache layers between runs using the GitHub Actions cache backend
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,mode=max,scope=backend
          tags: emp-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend
          tags: emp-frontend:ci

  # ── Job 4: Docker Compose configuration validation ────────────────────────
  compose-validate:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    # Run in parallel with docker-build — no dependency needed
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create minimal env files for Compose validation
        # docker compose config requires all referenced variables to be resolvable.
        # We supply safe placeholder values — no real secrets are needed for
        # syntactic validation.
        run: |
          # dev compose variables
          cat > .env << 'EOF'
          MYSQL_ROOT_PASSWORD=ci_root_placeholder
          DB_NAME=emp_portal_ci
          DB_USER=ci_user
          DB_PASSWORD=ci_placeholder
          JWT_SECRET=CIPlaceholderSecretThatIsAtLeast32Chars!!
          CORS_ORIGINS=http://localhost
          EOF

          # prod compose variables
          cat > .env.prod-ci << 'EOF'
          DB_HOST=ci-rds-placeholder.rds.amazonaws.com
          DB_PORT=3306
          DB_NAME=emp_portal
          DB_USER=ci_user
          DB_PASSWORD=ci_placeholder
          JWT_SECRET=CIPlaceholderSecretThatIsAtLeast32Chars!!
          CORS_ORIGINS=http://ci-placeholder
          EOF

      - name: Validate docker-compose.yml (dev)
        # Parses the full compose file, resolves variable substitutions,
        # and exits non-zero if any syntax or structural error is found.
        run: docker compose config --quiet

      - name: Validate docker-compose.prod.yml
        # Validates the production compose file with placeholder variables.
        # ECR_REGISTRY and IMAGE_TAG are injected inline for validation only.
        env:
          ECR_REGISTRY: "123456789.dkr.ecr.us-east-1.amazonaws.com"
          IMAGE_TAG: "ci-validation-sha"
        run: docker compose --file docker-compose.prod.yml --env-file .env.prod-ci config --quiet

  # ── Job 5: Publish to ECR ─────────────────────────────────────────────────
  #  Builds final images and pushes to ECR with immutable SHA tags.
  #  Runs ONLY on push to main — never on PRs, never on develop.
  #  Requires OIDC — no static AWS credentials anywhere.
  publish:
    name: Publish to ECR
    runs-on: ubuntu-latest
    needs: [docker-build, compose-validate]
    # Gate: only push images from the main branch, not from PRs or develop
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # OIDC requires id-token: write.
    # contents: read is sufficient for checkout.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}
          # No role-session-name forces a default — acceptable here
          # role-duration-seconds defaults to 3600 (1 hour) — sufficient

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Reuse cached layers from the earlier docker-build job
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,mode=max,scope=backend
          tags: |
            ${{ vars.ECR_REGISTRY }}/employee-management-backend:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/employee-management-backend:main-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend
          tags: |
            ${{ vars.ECR_REGISTRY }}/employee-management-frontend:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/employee-management-frontend:main-${{ github.sha }}

      - name: Record image tags in summary
        run: |
          echo "### Images published to ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| employee-management-backend | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| employee-management-frontend | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 6: Deploy to EC2 ──────────────────────────────────────────────────
  #  Connects to EC2 over SSH and runs the deployment script.
  #  - Runs only after publish succeeds
  #  - Requires the "production" GitHub environment
  #    (configure deployment protection rules in repo Settings → Environments)
  #  - EC2 pulls images from ECR using its IAM instance role — no AWS keys on EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout source (for scripts/)
        uses: actions/checkout@v4

      - name: Copy deployment files to EC2
        # Copies docker-compose.prod.yml and the scripts directory to EC2.
        # The target directory /opt/emp-portal must already exist (created by
        # bootstrap-ec2.sh).
        # .env.production must already exist on the host — it is NOT generated
        # by CI and is never transmitted over SSH to avoid secrets in logs.
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.prod.yml,scripts/"
          target:   "/opt/emp-portal"

      - name: Make scripts executable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script:   chmod +x /opt/emp-portal/scripts/*.sh

      - name: Deploy
        # Passes IMAGE_TAG, ECR_REGISTRY, and AWS_REGION as env vars to the
        # remote shell.  .env.production on EC2 supplies all other secrets.
        # Secrets are passed as env vars — they do not appear in the script
        # arguments or in any log output.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,ECR_REGISTRY,AWS_REGION
          script: |
            export IMAGE_TAG="${IMAGE_TAG}"
            export ECR_REGISTRY="${ECR_REGISTRY}"
            export AWS_REGION="${AWS_REGION}"
            export APP_DIR="/opt/emp-portal"
            bash /opt/emp-portal/scripts/deploy.sh "${IMAGE_TAG}"
        env:
          IMAGE_TAG:    ${{ github.sha }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          AWS_REGION:   ${{ vars.AWS_REGION }}

      - name: Smoke tests
        # Run real API verification against the deployed application.
        # Runs on the EC2 host via SSH so no ports need to be published
        # to GitHub Actions runners.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            export BASE_URL="http://localhost"
            export APP_DIR="/opt/emp-portal"
            bash /opt/emp-portal/scripts/smoke-test.sh

      - name: Record deployment in summary
        if: success()
        run: |
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Host | \`${{ secrets.EC2_HOST }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployed at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
