# ─────────────────────────────────────────────────────────────────────────────
#  Test profile application properties
#  Used by integration tests that load the full Spring context.
# ─────────────────────────────────────────────────────────────────────────────

# ── Spring Mail — safe no-op config for tests ────────────────────────────────
# Point to localhost on a non-existent port.
# Tests that exercise email sending should mock the EmailService or JavaMailSender.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Suppress mail auto-configuration health checks
spring.mail.test-connection=false
