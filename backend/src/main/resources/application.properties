# ──────────────────────────────────────────────────────────────
#  Employee Management Portal — Application Properties
#  Profile: default (development)
#  Package: com.company.employeemanagement
# ──────────────────────────────────────────────────────────────

# ── Load .env from project root (dev convenience) ───────────
# optional: means Spring Boot starts normally even when the file
# is absent (e.g. in CI where vars are injected by the pipeline).
spring.config.import=optional:file:../.env[.properties]

# ── Server ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── DataSource (MySQL) ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:emp_portal}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool (HikariCP) ───────────────────────────────
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=EmpPortalHikariPool

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true
# SQL migrations: classpath:db/migration (*.sql files)
# Java migrations: db.migration package — Flyway scans the same classpath
# location for compiled .class files in the db.migration package.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Automatically removes any failed migration entry from flyway_schema_history
# so the corrected script can be re-applied on the next startup.
spring.flyway.repair-on-migrate=true

# ── JWT ─────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTSigningThatIsAtLeast256BitsLong!!}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ── SpringDoc / Swagger UI ───────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha

# ── Spring Mail ─────────────────────────────────────────────
# All SMTP settings are read from environment variables.
# Set these in your shell or .env file before starting the application.
#
# Example (Gmail with App Password):
#   MAIL_HOST=smtp.gmail.com
#   MAIL_PORT=587
#   MAIL_USERNAME=yourapp@gmail.com
#   MAIL_PASSWORD=your-app-password
#   MAIL_FROM=yourapp@gmail.com
#
# Example (Mailtrap for development):
#   MAIL_HOST=sandbox.smtp.mailtrap.io
#   MAIL_PORT=2525
#   MAIL_USERNAME=<mailtrap-user>
#   MAIL_PASSWORD=<mailtrap-pass>
#   MAIL_FROM=noreply@company.local
#
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application name shown in OTP emails
app.mail.app-name=${APP_NAME:PeopleCore HR}
# From address used in OTP emails
app.mail.from=${MAIL_FROM:noreply@company.local}

# ── Groq AI (chat completions only) ─────────────────────────
# GROQ_API_KEY and GROQ_MODEL must be set as environment variables
# (or in .env) before the AI assistant endpoint is functional.
# The API key must NEVER be committed to source control.
# Groq is used EXCLUSIVELY for chat completions — NOT for embeddings.
#
# Obtain a free API key at: https://console.groq.com/keys
# Available models:  https://console.groq.com/docs/models
#
# Example:
#   GROQ_API_KEY=gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxx
#   GROQ_MODEL=llama-3.1-8b-instant
#
groq.api-key=${GROQ_API_KEY:}
# llama-3.1-8b-instant is an actively-supported Groq model as of mid-2025.
# llama3-8b-8192 (the previous default) was retired by Groq in April 2025.
# Override via GROQ_MODEL in .env to use a different model.
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
groq.base-url=https://api.groq.com/openai/v1/chat/completions
groq.timeout-ms=30000
groq.max-tokens=1024

# ── Hugging Face (embeddings only) ───────────────────────────
# HF_TOKEN is required for Phase 3 RAG vector embeddings.
# Groq does NOT offer an embeddings API; Hugging Face is the embedding provider.
# The token must NEVER be committed to source control.
#
# Obtain a free token at: https://huggingface.co/settings/tokens
# The free tier supports serverless inference including feature-extraction.
#
hf.token=${HF_TOKEN:}

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Logging ──────────────────────────────────────────────────
logging.level.com.company.employeemanagement=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ── AI RAG Knowledge Base ─────────────────────────────────────
# Enable or disable the RAG knowledge-base feature.
ai.rag.enabled=${RAG_ENABLED:true}
# Maximum characters per chunk when splitting document content.
ai.rag.chunk-size=1000
# Characters of overlap between consecutive chunks.
ai.rag.chunk-overlap=150
# Maximum number of knowledge chunks to retrieve per AI chat request (Phase 2B).
ai.rag.top-k=${RAG_TOP_K:5}
# Phase 3: Retrieval strategy — 'vector' (semantic) or 'database' (keyword).
ai.rag.retrieval-strategy=${RAG_RETRIEVAL_STRATEGY:vector}
# Phase 3: Minimum cosine similarity for a chunk to be included in results.
ai.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.70}
# Phase 3: Embedding — set to false to disable embedding generation (e.g. no token set).
ai.rag.embedding.enabled=${RAG_EMBEDDING_ENABLED:true}
# Phase 3: Embedding model — nomic-ai/nomic-embed-text-v1.5 produces 768-dimensional vectors.
# Override via RAG_EMBEDDING_MODEL in .env if a different model is needed.
# Must be the full Hugging Face model ID (e.g. nomic-ai/nomic-embed-text-v1.5).
ai.rag.embedding.model=${RAG_EMBEDDING_MODEL:nomic-ai/nomic-embed-text-v1.5}
