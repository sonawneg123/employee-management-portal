# ──────────────────────────────────────────────────────────────
#  Employee Management Portal — Application Properties
#  Profile: production
# ──────────────────────────────────────────────────────────────

# ── Server ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── DataSource (injected via Docker / AWS env vars) ─────────
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP ────────────────────────────────────────────────
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRY_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS}

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Logging ──────────────────────────────────────────────────
logging.level.com.company.employeemanagement=INFO
logging.level.org.springframework.security=WARN
